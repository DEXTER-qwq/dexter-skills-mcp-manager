# dsh-plugin-skills-management bundle patch: contributes the plugin row into the host
# composition when this package is installed via `dsh plugin add`.
#
# The plugin is HOST-PLANE: it registers a skill provider on the host
# `skills` registry and serves a local-only HTTP API over a webServer route
# (on-machine executor dirs + the dsh user library — no market, no git, no
# network), and its client half registers the management surface plus the
# executor-dir settings page. It must therefore land in the host composition
# (this insert), never inside an agent preset.

- insert:
    - id: skills-management
      name: '@weibaohui/skills-management'
